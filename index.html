<!DOCTYPE html>
<html lang="fr">
<head>

        body {
            display: grid;
            place-items: center;
            padding: 32px;
            box-sizing: border-box;
        }
        .page {
            max-width: 760px;
            width: 100%;

            padding: 12px 16px;
            border: 1px solid #111;
            border-radius: 8px;
            background: #f7f7f7;
            font-size: 16px;
        }
        a {
            color: inherit;
            text-decoration: none;
            border-bottom: 1px solid currentColor;
        }
        a:hover {
            opacity: 0.75;
        }
    </style>
</head>
<body>
